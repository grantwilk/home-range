<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f9f5" />
    <meta
      name="description"
      content="Find places to live in the United States by comparing climate, natural hazards, population, and distance to the places you care about."
    />
    <title>Home Range</title>
    <meta property="og:title" content="Home Range" />
    <meta
      property="og:description"
      content="Find places to live by filtering an interactive U.S. map by climate, natural hazards, population, and nearby places."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="./assets/mark.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="workspace">
      <section class="mapcard" aria-label="Interactive United States map">
        <div class="map-toolbar">
          <span class="map-scope" title="Home Range"
            ><img src="./assets/mark.svg" width="27" height="27" alt="" /><span
              >Home Range</span
            ></span
          >
          <span class="map-divider"></span
          ><span id="grain" class="scale-label">U.S. County Map</span>
          <div class="map-actions">
            <button class="map-search" id="search">
              <i data-icon="search"></i>Find a Place <kbd>/</kbd>
            </button>
            <button
              id="share"
              class="secondary"
              aria-label="Share View"
              title="Share View"
            >
              <i data-icon="share"></i><span>Share View</span>
            </button>
            <button
              id="export-pdf"
              class="secondary"
              aria-label="Export PDF"
              title="Export this map with town labels and a key"
              disabled
            >
              <i data-icon="download"></i><span>Export PDF</span>
            </button>
          </div>
        </div>
        <div id="mapfield">
          <svg
            id="map"
            role="img"
            aria-label="United States county map. Use Find a Place for keyboard access to every map value."
          >
            <defs>
              <pattern
                id="missing"
                width="5"
                height="5"
                patternUnits="userSpaceOnUse"
              >
                <rect width="5" height="5" fill="#ebece5" />
                <path
                  d="M-1 1 1-1M0 5 5 0M4 6 6 4"
                  stroke="#a9b0a4"
                  stroke-width="1"
                />
              </pattern>
              <pattern
                id="uncertain"
                width="5"
                height="5"
                patternUnits="userSpaceOnUse"
              >
                <rect width="5" height="5" fill="#deddd1" />
                <circle cx="2.5" cy="2.5" r="1" fill="#827d6e" />
              </pattern>
              <clipPath id="land-clip"><path id="land-shape"></path></clipPath>
              <g id="access-clips"></g>
              <g id="access-shapes"></g>
              <pattern id="access-missing" href="#missing"></pattern>
              <pattern id="access-uncertain" href="#uncertain"></pattern>
            </defs>
            <svg id="map-fit" viewBox="-63 -18 1055 655" overflow="visible">
              <g id="viewport">
                <g id="basemap"></g>
                <g id="areas"></g>
                <g
                  id="access-overlay"
                  clip-path="url(#land-clip)"
                  style="display: none"
                ></g>
                <path id="nature-outline"></path>
                <g id="borders"></g>
                <g id="statelabels"></g>
                <g id="reference-towns"></g>
                <g id="reference-pins"></g>
                <g id="highlight"></g>
              </g>
            </svg>
          </svg>
          <div id="access-status" role="status" hidden></div>
          <div id="hover" hidden></div>
          <div id="loading" role="status">Loading Home Range…</div>
        </div>
        <div id="map-controls">
          <div class="compass" aria-hidden="true">
            N<svg width="16" height="27" viewBox="0 0 16 27">
              <path d="M8 1 15 23l-7-5z" fill="#768278" />
              <path d="M8 1 1 23l7-5z" fill="#34493d" />
            </svg>
          </div>
        </div>
        <div class="map-footer">
          <div class="legend">
            <div class="legend-title">
              <span class="metricicon" id="legend-icon"></span>
              <div>
                <strong id="legend-name">Average January Low</strong>
                <div class="meta" id="legend-sub">
                  Average daily low · 1991–2020
                </div>
              </div>
              <span class="unit" id="legend-unit">°F</span>
            </div>
            <div id="legend-scale">
              <div class="colors" id="colors"></div>
              <div id="legend-keys"></div>
            </div>
            <div id="reference-key" role="group" aria-label="Map Key"></div>
            <div id="credits" class="credits"></div>
          </div>
          <div class="maptools">
            <button id="zoomin" aria-label="Zoom In">
              <i data-icon="plus"></i></button
            ><button id="zoomout" aria-label="Zoom Out">
              <i data-icon="minus"></i></button
            ><button id="fit" aria-label="Reset Map Extent">
              <i data-icon="fit"></i>
            </button>
          </div>
        </div>
      </section>
      <aside class="settings" id="settings" aria-labelledby="filters-title">
        <div class="railtitle">
          <h1 id="filters-title">Filters</h1>
          <div
            class="logic"
            id="rail-controls"
            role="group"
            aria-label="Combine filters"
          >
            <button id="all">Match All</button>
            <button id="any">Match Any</button>
          </div>
          <button
            id="fold"
            class="iconbtn"
            aria-label="Collapse Filters"
            aria-expanded="true"
            aria-controls="rail-controls filters filter-actions"
          >
            <i data-icon="chevron"></i>
          </button>
        </div>
        <div
          id="filters"
          tabindex="0"
          role="region"
          aria-label="Scrollable filter layers"
        ></div>
        <div class="railfoot" id="filter-actions">
          <button id="add-filter" class="add-filter">
            <i data-icon="plus"></i>Add Filter
          </button>
        </div>
      </aside>
    </main>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialogtop">
        <h2 id="dialog-title"></h2>
        <button id="close" aria-label="Close Dialog" class="iconbtn">
          <i data-icon="cross"></i>
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
